name: Release agent

# Publishing a GitHub release (tag like v1.0.1) builds the obfuscated extension zip and attaches it to that release,
# with a .sha256 file next to it, so buyers can check that the zip they got is the one built here.
# The build is reproducible (fixed obfuscator seed and file dates), so anyone can build the tag and get the same hash.
on:
  release:
    types: [published]

# Read only by default; only the job that uploads may write (security review SITE-06).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # In GitHub, Settings > Environments > release: add yourself as a required reviewer, so no release reaches buyers
    # without your approval (a stolen token or a collaborator cannot ship one alone).
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./src/manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Write the checksum
        run: |
          cd dist
          for f in Bolblar-Agent-*.zip; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done

      # Upload once: a published asset is never replaced silently (no --clobber).
      - name: Attach zip and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Bolblar-Agent-*.zip dist/Bolblar-Agent-*.zip.sha256
